x-aplikasi: &aplikasi
  build: .
  image: suksesabadi:local
  environment: &env-aplikasi
    APP_NAME: "Toko Sukses Abadi"
    APP_ENV: production
    APP_DEBUG: "false"
    # Compose otomatis membaca APP_KEY dari file .env di folder yang sama
    APP_KEY: "${APP_KEY:?Isi APP_KEY di file .env, buat dengan php artisan key:generate --show}"
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_LOCALE: id
    DB_CONNECTION: sqlite
    DB_DATABASE: /data/database.sqlite
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    LOG_CHANNEL: stderr
    # Email pengingat: log = hanya ditulis ke log (uji coba); smtp = benar-benar terkirim
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
    MAIL_PORT: ${MAIL_PORT:-2525}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
    MAIL_FROM_NAME: "Toko Sukses Abadi"
    PENGINGAT_EMAIL_TUJUAN: ${PENGINGAT_EMAIL_TUJUAN:-}
  volumes:
    - sqlite_data:/data                      # database SQLite
    - uploads:/var/www/html/storage/app      # bukti kuitansi yang diunggah
  restart: unless-stopped

services:
  app:
    <<: *aplikasi
    ports:
      - "8080:80"
    environment:
      <<: *env-aplikasi
      RUN_MIGRATIONS: "true"
      RUN_SEED: ${RUN_SEED:-false}

  # Menjalankan jadwal Laravel (pengingat email). Tanpa ini email tidak terkirim otomatis.
  scheduler:
    <<: *aplikasi
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan schedule:work"]
    environment:
      <<: *env-aplikasi
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    depends_on:
      - app

volumes:
  sqlite_data:
  uploads:.env.example