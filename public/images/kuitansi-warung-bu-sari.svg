<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Desk -->
  <rect width="400" height="500" fill="#dfd7ca" rx="8"/>
  <rect x="290" y="30" width="85" height="150" rx="8" fill="#2d3748" filter="url(#shadow)"/>
  <!-- Calculator keys preview -->
  <rect x="300" y="45" width="65" height="25" rx="3" fill="#a0aec0"/>
  <circle cx="310" cy="90" r="6" fill="#4a5568"/>
  <circle cx="327" cy="90" r="6" fill="#4a5568"/>
  <circle cx="344" cy="90" r="6" fill="#4a5568"/>
  <circle cx="310" cy="110" r="6" fill="#4a5568"/>
  <circle cx="327" cy="110" r="6" fill="#4a5568"/>
  <circle cx="344" cy="110" r="6" fill="#4a5568"/>
  <circle cx="310" cy="130" r="6" fill="#4a5568"/>
  <circle cx="327" cy="130" r="6" fill="#4a5568"/>
  <circle cx="344" cy="130" r="6" fill="#4a5568"/>

  <!-- Pen -->
  <rect x="320" y="220" width="10" height="180" rx="4" fill="#2b6cb0" transform="rotate(15 320 220)"/>

  <!-- Paper Receipt -->
  <g filter="url(#shadow)" transform="rotate(-1 200 250)">
    <rect x="35" y="40" width="280" height="420" fill="#fdfbf7" stroke="#e2e8f0" stroke-width="1" rx="2"/>
    
    <!-- Receipt Header -->
    <text x="175" y="75" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a202c">*** NOTA PENJUALAN ***</text>
    <text x="175" y="93" font-family="monospace" font-size="11" text-anchor="middle" fill="#4a5568">TOKO SUKSES ABADI</text>
    <text x="175" y="108" font-family="monospace" font-size="9" text-anchor="middle" fill="#718096">Jl. Pasar Senen No. 42 • Telp: 0812-3456-7890</text>
    <line x1="50" y1="118" x2="300" y2="118" stroke="#cbd5e0" stroke-dasharray="4,4"/>

    <!-- Receipt Meta -->
    <text x="50" y="138" font-family="monospace" font-size="10" fill="#4a5568">No. Kuitansi: KWT-240918</text>
    <text x="50" y="153" font-family="monospace" font-size="10" fill="#4a5568">Tanggal     : 18 Sep 2026</text>
    <text x="50" y="168" font-family="monospace" font-size="10" fill="#4a5568">Pelanggan   : Warung Bu Sari</text>
    <line x1="50" y1="180" x2="300" y2="180" stroke="#cbd5e0"/>

    <!-- Items Table -->
    <text x="50" y="198" font-family="monospace" font-size="10" font-weight="bold" fill="#2d3748">Item</text>
    <text x="210" y="198" font-family="monospace" font-size="10" font-weight="bold" fill="#2d3748">Qty</text>
    <text x="250" y="198" font-family="monospace" font-size="10" font-weight="bold" fill="#2d3748">Subtotal</text>
    <line x1="50" y1="205" x2="300" y2="205" stroke="#cbd5e0"/>

    <text x="50" y="225" font-family="monospace" font-size="9" fill="#2d3748">Minyak Goreng 1L</text>
    <text x="215" y="225" font-family="monospace" font-size="9" fill="#2d3748">25 dus</text>
    <text x="245" y="225" font-family="monospace" font-size="9" fill="#2d3748">8.750.000</text>

    <line x1="50" y1="280" x2="300" y2="280" stroke="#cbd5e0" stroke-dasharray="4,4"/>

    <!-- Totals -->
    <text x="50" y="302" font-family="monospace" font-size="10" font-weight="bold" fill="#2d3748">Total Tagihan :</text>
    <text x="235" y="302" font-family="monospace" font-size="10" font-weight="bold" fill="#2d3748">Rp 8.750.000</text>

    <text x="50" y="322" font-family="monospace" font-size="10" fill="#4a5568">Uang Muka (DP):</text>
    <text x="235" y="322" font-family="monospace" font-size="10" fill="#4a5568">Rp 3.000.000</text>

    <text x="50" y="342" font-family="monospace" font-size="10" fill="#4a5568">Cicilan 1     :</text>
    <text x="235" y="342" font-family="monospace" font-size="10" fill="#4a5568">Rp 2.000.000</text>

    <line x1="50" y1="352" x2="300" y2="352" stroke="#e2e8f0"/>
    <text x="50" y="372" font-family="monospace" font-size="11" font-weight="bold" fill="#9b2c2c">Sisa Piutang  :</text>
    <text x="230" y="372" font-family="monospace" font-size="11" font-weight="bold" fill="#9b2c2c">Rp 3.750.000</text>

    <!-- Stamp -->
    <g transform="translate(190, 390) rotate(-10)">
      <rect x="0" y="0" width="95" height="35" rx="4" fill="none" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6,2"/>
      <text x="47" y="22" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6cb0" letter-spacing="1">CICILAN</text>
    </g>

    <text x="50" y="435" font-family="monospace" font-size="8" fill="#a0aec0">Terima kasih atas kerjasamanya.</text>
  </g>
</svg>

